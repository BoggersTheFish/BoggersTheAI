[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinking-system"
version = "0.5.0-alpha.1"
description = "Verifier-first research architecture for constructing, measuring, localising and minimally revising structured reasoning systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Thinking System Contributors" }]
keywords = [
  "thinking-system",
  "verifier-first",
  "structured-reasoning",
  "residual-accounting",
  "bogvm",
  "ts-kernel",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml",
  "jsonschema",
  "numpy",
]

[project.optional-dependencies]
llm = [
  "ollama",
]
gpu = [
  "ollama",
  "unsloth[colab-new]>=2024.9",
  "torch>=2.4.0",
]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "isort",
  "ruff",
  "mypy",
  "fastapi",
  "uvicorn",
  "ollama",
]
all = [
  "ollama",
  "unsloth[colab-new]>=2024.9",
  "torch>=2.4.0",
  "rich",
  "fastapi",
  "uvicorn",
  "feedparser",
]
multimodal = [
  "faster-whisper",
  "transformers",
  "pillow",
  "piper-tts",
]
adapters = [
  "feedparser",
]
security = [
  "defusedxml",
]


[project.urls]
Homepage = "https://github.com/BoggersTheFish/thinking-system"
Repository = "https://github.com/BoggersTheFish/thinking-system"
Issues = "https://github.com/BoggersTheFish/thinking-system/issues"
Documentation = "https://github.com/BoggersTheFish/thinking-system/tree/main/docs"

[project.scripts]
ts = "thinking_system.apps.cli.main:main"
boggers = "thinking_system.apps.cli.main:run_legacy_chat"
dashboard-start = "thinking_system.apps.cli.main:run_legacy_dashboard"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "thinking_system*",
  "BoggersTheAI*",
  "core*",
  "adapters*",
  "dashboard*",
  "entities*",
  "experiments*",
  "interface*",
  "mind*",
  "multimodal*",
  "tools*",
  "shared*",
  "apps*",
]
# Intentionally omit empty placeholder trees: packages/*, engines/* (top-level),
# research/*, benchmarks/* — those are not installable Python packages yet.

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.md", "*.bogpkg", "seed_tasks/*.json"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # black handles line length
    "E402",  # module level import not at top - legacy code
    "E741",  # ambiguous var l
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring network access",
]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    "reasoner",
    "core-vm",
    "inference",
    "mind",
    "tests"
]
