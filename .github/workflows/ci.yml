name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-smoke:
    name: Test suite + kernel smoke demo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}-py${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps
        run: |
          python -m pip install --upgrade pip

      - name: Install package
        run: |
          # Install minimal runtime. Use editable mode so tests can import package sources.
          pip install -e .

      - name: Install test runner
        run: |
          pip install pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Kernel smoke demo (minimal)
        env:
          CI: true
        run: |
          # Run a minimal deterministic demo that does not require Ollama or GPU
          python -m core.kernel.demo --json
