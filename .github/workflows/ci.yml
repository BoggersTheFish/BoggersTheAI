name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Isort
        run: isort --check .
      - name: Mypy
        run: mypy core/kernel --explicit-package-bases --ignore-missing-imports --follow-imports=skip --no-error-summary
      - name: Package smoke mypy
        run: mypy core/kernel core/trace_processor.py core/ts_engine.py interface/api.py --ignore-missing-imports --follow-imports=skip --no-error-summary
      - name: Tests
        run: pytest -q
      - name: Coverage
        run: pytest --cov=BoggersTheAI --cov-fail-under=60
