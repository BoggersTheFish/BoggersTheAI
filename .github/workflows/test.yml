name: typecheck

# Separate, non-contradictory optional quality job.
# Full gates (format, lint, architecture, docs, unit tests, demo) live in ci.yml.
# This workflow only runs a narrow mypy smoke on kernel surfaces.

on:
  push:
    branches: [main, master, "refactor/*"]
  pull_request:
    branches: [main, master]

jobs:
  mypy-kernel:
    name: Mypy kernel smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-mypy-${{ hashFiles('**/pyproject.toml') }}-py${{ matrix.python-version }}
          restore-keys: |
            ${{ runner.os }}-pip-mypy-
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Type check kernel (narrow)
        run: >
          mypy core/kernel
          --explicit-package-bases
          --ignore-missing-imports
          --follow-imports=skip
          --no-error-summary
